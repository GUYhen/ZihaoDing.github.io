<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290"
     role="img" aria-label="Abstract page of notes">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff1fa"/>
      <stop offset="1" stop-color="#d2d8ed"/>
    </linearGradient>
    <filter id="nsh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#34405e" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="400" height="290" fill="url(#nbg)"/>

  <g transform="rotate(-6 200 145)" filter="url(#nsh)">
    <rect x="66" y="12" width="268" height="266" rx="18" fill="#ffffff"/>
    <rect x="104" y="56" width="134" height="19" rx="9.5" fill="#34405e"/>
    <g fill="#a9b3c6">
      <rect x="104" y="106" width="192" height="14" rx="7"/>
      <rect x="104" y="140" width="168" height="14" rx="7"/>
      <rect x="104" y="174" width="192" height="14" rx="7"/>
      <rect x="104" y="208" width="112" height="14" rx="7"/>
    </g>
    <rect x="104" y="246" width="64" height="15" rx="7.5" fill="#527bbd"/>
  </g>
</svg>
