<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290"
     role="img" aria-label="Abstract federated network">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2fd"/>
      <stop offset="1" stop-color="#c6dbf3"/>
    </linearGradient>
    <radialGradient id="fglow" cx=".5" cy=".45" r=".58">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="290" fill="url(#fbg)"/>
  <ellipse cx="200" cy="140" rx="205" ry="160" fill="url(#fglow)"/>

  <g stroke="#527bbd" stroke-width="3.5" stroke-linecap="round" opacity=".5">
    <line x1="200" y1="145" x2="200" y2="57"/>
    <line x1="200" y1="145" x2="312" y2="118"/>
    <line x1="200" y1="145" x2="269" y2="216"/>
    <line x1="200" y1="145" x2="131" y2="216"/>
  </g>
  <line x1="200" y1="145" x2="88" y2="118" stroke="#527bbd" stroke-width="3.5"
        stroke-linecap="round" stroke-dasharray="9 12" opacity=".33"/>

  <g fill="#527bbd">
    <circle cx="200" cy="57"  r="21"/>
    <circle cx="312" cy="118" r="21"/>
    <circle cx="269" cy="216" r="21"/>
    <circle cx="131" cy="216" r="21"/>
  </g>
  <circle cx="88" cy="118" r="21" fill="#ffffff" stroke="#527bbd"
          stroke-width="3" stroke-dasharray="7 8" opacity=".85"/>

  <circle cx="200" cy="145" r="40" fill="#34405e"/>
  <circle cx="200" cy="145" r="40" fill="none" stroke="#ffffff" stroke-width="5" opacity=".5"/>
</svg>
