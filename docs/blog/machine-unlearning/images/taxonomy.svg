<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 296" width="860" height="296"
     font-family="Georgia, 'Times New Roman', serif" role="img"
     aria-label="Three independent ways the machine unlearning literature is divided: by the strength of the guarantee, by what is removed, and by where the data sits.">
  <text x="25" y="26" font-size="12.5" fill="#7c8aa3" letter-spacing=".04em">1 · by the guarantee</text>
  <line x1="25" y1="36" x2="275" y2="36" stroke="#dfe6f2"/>
  <rect x="25" y="54" width="250" height="46" rx="8" fill="#fbfcfe" stroke="#e4eaf4"/>
  <rect x="25" y="54" width="3.5" height="46" rx="1.8" fill="#527bbd"/>
  <text x="39" y="74" font-size="14.5" fill="#34405e">exact</text>
  <text x="39" y="90" font-size="11" fill="#8b98ab">identical in distribution to retraining</text>
  <rect x="25" y="112" width="250" height="46" rx="8" fill="#fbfcfe" stroke="#e4eaf4"/>
  <rect x="25" y="112" width="3.5" height="46" rx="1.8" fill="#527bbd"/>
  <text x="39" y="132" font-size="14.5" fill="#34405e">approximate</text>
  <text x="39" y="148" font-size="11" fill="#8b98ab">(ε, δ)-close: certified or heuristic</text>
  <text x="305" y="26" font-size="12.5" fill="#7c8aa3" letter-spacing=".04em">2 · by what is removed</text>
  <line x1="305" y1="36" x2="555" y2="36" stroke="#dfe6f2"/>
  <rect x="305" y="54" width="250" height="46" rx="8" fill="#fbfcfe" stroke="#e4eaf4"/>
  <rect x="305" y="54" width="3.5" height="46" rx="1.8" fill="#8494ad"/>
  <text x="319" y="74" font-size="14.5" fill="#34405e">sample</text>
  <text x="319" y="90" font-size="11" fill="#8b98ab">a handful of records</text>
  <rect x="305" y="112" width="250" height="46" rx="8" fill="#fbfcfe" stroke="#e4eaf4"/>
  <rect x="305" y="112" width="3.5" height="46" rx="1.8" fill="#8494ad"/>
  <text x="319" y="132" font-size="14.5" fill="#34405e">feature or label</text>
  <text x="319" y="148" font-size="11" fill="#8b98ab">one attribute, across the set</text>
  <rect x="305" y="170" width="250" height="46" rx="8" fill="#fbfcfe" stroke="#e4eaf4"/>
  <rect x="305" y="170" width="3.5" height="46" rx="1.8" fill="#8494ad"/>
  <text x="319" y="190" font-size="14.5" fill="#34405e">class</text>
  <text x="319" y="206" font-size="11" fill="#8b98ab">every sample with one label</text>
  <rect x="305" y="228" width="250" height="46" rx="8" fill="#fbfcfe" stroke="#e4eaf4"/>
  <rect x="305" y="228" width="3.5" height="46" rx="1.8" fill="#8494ad"/>
  <text x="319" y="248" font-size="14.5" fill="#34405e">client</text>
  <text x="319" y="264" font-size="11" fill="#8b98ab">one party's whole dataset</text>
  <text x="585" y="26" font-size="12.5" fill="#7c8aa3" letter-spacing=".04em">3 · by where the data sits</text>
  <line x1="585" y1="36" x2="835" y2="36" stroke="#dfe6f2"/>
  <rect x="585" y="54" width="250" height="46" rx="8" fill="#fbfcfe" stroke="#e4eaf4"/>
  <rect x="585" y="54" width="3.5" height="46" rx="1.8" fill="#8494ad"/>
  <text x="599" y="74" font-size="14.5" fill="#34405e">centralised</text>
  <text x="599" y="90" font-size="11" fill="#8b98ab">one party holds everything</text>
  <rect x="585" y="112" width="250" height="46" rx="8" fill="#fbfcfe" stroke="#e4eaf4"/>
  <rect x="585" y="112" width="3.5" height="46" rx="1.8" fill="#527bbd"/>
  <text x="599" y="132" font-size="14.5" fill="#34405e">federated (FU)</text>
  <text x="599" y="148" font-size="11" fill="#8b98ab">data never leaves the client</text>
  <rect x="585" y="170" width="250" height="46" rx="8" fill="#fbfcfe" stroke="#e4eaf4"/>
  <rect x="585" y="170" width="3.5" height="46" rx="1.8" fill="#e8865e"/>
  <text x="599" y="190" font-size="14.5" fill="#34405e">LLM / generative</text>
  <text x="599" y="206" font-size="11" fill="#8b98ab">a capability, not a named subset</text>
  <rect x="585" y="228" width="250" height="46" rx="8" fill="#fbfcfe" stroke="#e4eaf4"/>
  <rect x="585" y="228" width="3.5" height="46" rx="1.8" fill="#58b99d"/>
  <text x="599" y="248" font-size="14.5" fill="#34405e">graph, recommender</text>
  <text x="599" y="264" font-size="11" fill="#8b98ab">deleting one record moves its neighbours</text>
</svg>
