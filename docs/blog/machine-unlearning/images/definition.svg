<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300"
     font-family="Georgia, 'Times New Roman', serif" role="img"
     aria-label="Two paths from the training data to a model: train then unlearn, versus retrain on the retained data alone. The two end models must be indistinguishable.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8494ad"/>
    </marker>
  </defs>

  <!-- ============ top path: train on everything, then unlearn ============ -->
  <rect x="36" y="46" width="268" height="78" rx="11" fill="#fbfcfe" stroke="#cfdaeb"/>
  <rect x="48" y="58" width="176" height="54" rx="7" fill="#e9f0fa" stroke="#527bbd" stroke-width="1.4"/>
  <text x="136" y="85" text-anchor="middle" font-size="19" fill="#34405e"><tspan font-style="italic">D</tspan><tspan font-size="12" dy="-8">r</tspan></text>
  <text x="136" y="103" text-anchor="middle" font-size="11" fill="#7c8aa3">keep</text>
  <rect x="232" y="58" width="60" height="54" rx="7" fill="#fceade" stroke="#e8865e" stroke-width="1.4"/>
  <text x="262" y="85" text-anchor="middle" font-size="19" fill="#9c4a22"><tspan font-style="italic">D</tspan><tspan font-size="12" dy="-8">f</tspan></text>
  <text x="262" y="103" text-anchor="middle" font-size="11" fill="#b5764f">delete</text>
  <text x="36" y="36" font-size="12.5" fill="#475569">everything the model was trained on</text>

  <line x1="312" y1="85" x2="388" y2="85" stroke="#8494ad" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="350" y="76" text-anchor="middle" font-size="16" font-style="italic" fill="#34405e">A</text>
  <text x="350" y="101" text-anchor="middle" font-size="11" fill="#7c8aa3">train</text>

  <circle cx="428" cy="85" r="33" fill="#eef3fa" stroke="#527bbd" stroke-width="1.6"/>
  <text x="428" y="93" text-anchor="middle" font-size="21" font-style="italic" fill="#34405e">&#952;</text>

  <line x1="463" y1="85" x2="547" y2="85" stroke="#8494ad" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="505" y="76" text-anchor="middle" font-size="16" font-style="italic" fill="#34405e">U</text>
  <text x="505" y="101" text-anchor="middle" font-size="11" fill="#7c8aa3">unlearn</text>

  <circle cx="584" cy="85" r="33" fill="#eef3fa" stroke="#34405e" stroke-width="1.8"/>
  <text x="584" y="93" text-anchor="middle" font-size="21" fill="#34405e"><tspan font-style="italic">&#952;</tspan><tspan font-size="11" dy="-9">unl</tspan></text>

  <!-- ============ bottom path: the honest, expensive answer ============ -->
  <rect x="36" y="186" width="268" height="78" rx="11" fill="#fbfcfe" stroke="#cfdaeb"/>
  <rect x="48" y="198" width="176" height="54" rx="7" fill="#e9f0fa" stroke="#527bbd" stroke-width="1.4"/>
  <text x="136" y="225" text-anchor="middle" font-size="19" fill="#34405e"><tspan font-style="italic">D</tspan><tspan font-size="12" dy="-8">r</tspan></text>
  <text x="136" y="243" text-anchor="middle" font-size="11" fill="#7c8aa3">keep</text>
  <rect x="232" y="198" width="60" height="54" rx="7" fill="none" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="262" y="230" text-anchor="middle" font-size="11" fill="#aab6c6">never</text>
  <text x="262" y="243" text-anchor="middle" font-size="11" fill="#aab6c6">seen</text>

  <line x1="312" y1="225" x2="547" y2="225" stroke="#8494ad" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="430" y="216" text-anchor="middle" font-size="16" font-style="italic" fill="#34405e">A</text>
  <text x="430" y="241" text-anchor="middle" font-size="11" fill="#7c8aa3">retrain from scratch</text>

  <circle cx="584" cy="225" r="33" fill="#ffffff" stroke="#58b99d" stroke-width="1.8"/>
  <text x="584" y="233" text-anchor="middle" font-size="21" fill="#34405e"><tspan font-style="italic">&#952;</tspan><tspan font-size="14" dy="-9">&#9733;</tspan></text>

  <!-- ============ the requirement that ties them together ============ -->
  <path d="M 619 85 H 646 V 225 H 619" fill="none" stroke="#58b99d" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="664" y="163" font-size="22" fill="#58b99d">&#8776;</text>
  <text x="690" y="149" font-size="13" fill="#475569">no test should tell</text>
  <text x="690" y="168" font-size="13" fill="#475569">these two apart</text>
  <text x="690" y="187" font-size="11.5" fill="#8b98ab">that is the whole problem</text>
</svg>
